<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gambit Room</title>
  <style>
    :root {
      --walnut: #6b4a34;
      --cream: #f3ead9;
      --forest: #2f5233;
      --ink: #2b241d;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.25em;
      color: var(--walnut);
    }
    p {
      font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
      color: var(--forest);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div>
    <h1>Gambit Room</h1>
    <p>The board is being built. Check back soon.</p>
  </div>
</body>
</html>
